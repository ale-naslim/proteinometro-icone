<title>Proteinômetro</title>
<style>
  /* Fundo na COR DO MENU (nao mais creme): se sobrar qualquer faixa embaixo do
     app, ela se funde visualmente com a barra de abas em vez de virar um bloco
     claro. E a rede de seguranca do ajuste automatico de altura abaixo. */
  html,body{margin:0;height:100%;background:#171610;overscroll-behavior:none}
  /* O iframe e ANCORADO nas quatro bordas em vez de receber uma altura calculada.
     Tentativas com height:100% e com px vindos de visualViewport sempre deixavam
     uma faixa vazia na base; ancorando, a altura vira geometria e nao aritmetica.
     So o topo recua, pela Dynamic Island / status bar. */
  /* O WRAPPER e quem estica: um <div> obedece as quatro ancoras, mas um <iframe>
     e elemento substituido — sem width/height explicitos ele cai no tamanho
     intrinseco (300x150) e as ancoras sao ignoradas. Entao o div faz a geometria
     e o iframe so preenche 100% dele. */
  /* O wrapper vai de borda a borda, SEM reservar o topo. Reservar aqui fazia a
     pagina do Apps Script calcular o layout com a tela cheia e perder exatamente
     esse tanto na BASE (medido: tela 852, topo 59, app so 734 -> faixa de 59px).
     Em Safari, onde nao havia reserva, sempre funcionou. Quem recua o conteudo do
     topo agora e o APP, com o valor que mandamos por postMessage. */
  #wrap{position:fixed; top:0; left:0; right:0; bottom:0}
  /* sonda: le o valor real do recorte do topo pra repassar ao app */
  #probe{position:absolute;visibility:hidden;pointer-events:none;
    top:0;left:0;width:1px;padding-top:env(safe-area-inset-top)}
  #wrap iframe{border:0; display:block; width:100%; height:100%}
  .aviso{color:#171610;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;
    padding:28px;max-width:420px;margin:0 auto}
  .aviso b{display:block;font-size:21px;margin-bottom:10px}
  code{background:#dcd9cc;padding:3px 7px;border-radius:6px;font-size:13px;
    word-break:break-all;display:inline-block;margin-top:8px}
</style>

<body>
<div id="wrap"></div>
<div id="probe"></div>
<script>
/* O endereço do app vai depois do # — assim a senha NÃO fica dentro deste
   arquivo, que é público. O iOS guarda a URL inteira (com o #) ao adicionar
   à tela de início, então o atalho abre já apontando pro lugar certo. */
(function(){
  var alvo = decodeURIComponent(location.hash.slice(1) || '');
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/.test(alvo);
  if(!ok){
    document.body.innerHTML =
      '<div class="aviso"><b>Falta o endereço do app.</b>' +
      'Abra esta página com o endereço do robô depois do <b>#</b>:' +
      '<code>' + location.origin + location.pathname +
      '#https://script.google.com/macros/s/SEU_ID/exec?t=SENHA</code></div>';
    return;
  }
  var f = document.createElement('iframe');
  f.src = alvo;
  f.title = 'Proteinômetro';
  f.setAttribute('allow','clipboard-write; camera; microphone');
  (document.getElementById('wrap') || document.body).appendChild(f);

  /* O wrapper do Apps Script mede a altura do conteudo UMA vez. Dentro de um
     iframe aninhado ele mede cedo demais e pega so o spinner de carregamento,
     e o app fica preso numa faixa curta com fundo vazio embaixo. Um empurrao de
     layout forca a remedicao. Repetimos porque a carga pode demorar. */
  /* A altura ja vem das ancoras do CSS. Este empurrao existe so porque o wrapper
     do Apps Script mede o conteudo UMA vez e, aninhado, mede cedo demais (pega so
     o spinner). Mexer na ancora de baixo e voltar forca a remedicao la dentro.
     NAO dispare um 'resize' sintetico: havia um listener de resize aqui e um
     alimentava o outro num laco infinito que deixava a pagina em branco. */
  var wrap = document.getElementById('wrap');
  var ajusta = function(){
    if (!wrap) return;
    wrap.style.bottom = '1px';
    wrap.getBoundingClientRect();
    wrap.style.bottom = '0px';
  };
  [1200, 3000, 6000].forEach(function(t){ setTimeout(ajusta, t); });
  f.addEventListener('load', function(){ setTimeout(ajusta, 900); });
  window.addEventListener('orientationchange', function(){ setTimeout(ajusta, 400); });

  /* Se a conversa de altura com o app nao acontecer (versao antiga em cache,
     postMessage bloqueado), estica assim mesmo pelo recorte do topo — que foi
     exatamente o tanto que a pagina do Apps Script engoliu na base. */
  /* BUG PAGO: a condicao era `!wrap.style.bottom`, mas o ajuste automatico grava
     "0px" quando calcula zero — string NAO vazia — entao a rede de seguranca nunca
     disparava. Agora comparamos o VALOR, nao a existencia da string. */
  var redeDeSeguranca = function(){
    if (!wrap) return;
    var aplicado = -(parseFloat(wrap.style.bottom) || 0);
    if (aplicado > 0) return;                 // ja ajustado pela conversa com o app
    var p = document.getElementById('probe');
    var t = p ? Math.round(parseFloat(getComputedStyle(p).paddingTop) || 0) : 0;
    if (t > 0) wrap.style.bottom = (-t) + 'px';
  };
  setTimeout(redeDeSeguranca, 2500);
  setTimeout(redeDeSeguranca, 6000);

  /* A pagina do Apps Script embrulha o app num iframe MENOR que a area visivel
     (medido no iPhone: tela 852, casca 793, app 734 — some ~59px que a pagina do
     Google reserva). Resultado: a barra de abas do app, em bottom:0, parava antes
     da borda e sobrava uma faixa clara.
     O app manda a altura real dele por postMessage (funciona cross-origin) e aqui
     esticamos o wrapper PRA BAIXO exatamente o que falta — a sobra sai da tela.
     Converge sozinho: com a extensao O aplicada, altura do wrap = V + O e o app
     recebe V + O - G; pedir O = altura_wrap - altura_app da O = G e fica estavel.
     Sem constante chumbada, entao vale pra qualquer aparelho. */
  /* Le o recorte do topo (Dynamic Island). env() so funciona aqui, no documento de
     topo: dentro de iframe ele resolve como 0. */
  var recorteTopo = function(){
    var p = document.getElementById('probe');
    return p ? Math.round(parseFloat(getComputedStyle(p).paddingTop) || 0) : 0;
  };

  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (!d || d.pm !== 'proteinometro-h' || !d.h || !wrap) return;
    /* ev.source e um handle DIRETO pra janela do app — responde sem depender da
       hierarquia de frames (a casca nao alcanca o sandbox do Apps Script de outro jeito). */
    try { ev.source.postMessage({ pm:'proteinometro-safe', top: recorteTopo() }, '*'); } catch(e){}
    var falta = Math.round(wrap.getBoundingClientRect().height - d.h);
    if (falta < 0) falta = 0;
    if (falta > 300) return;                       // valor absurdo: ignora
    var atual = -(parseFloat(wrap.style.bottom) || 0);
    if (Math.abs(falta - atual) > 1) wrap.style.bottom = (-falta) + 'px';
  });

  /* MODO DIAGNOSTICO: abra a mesma URL com ?diag=1 antes do #.
     O fundo da CASCA fica vermelho, entao qualquer pedaco vermelho na tela e area
     que o iframe NAO esta cobrindo. Se a faixa vazia continuar creme (sem vermelho),
     o vazio esta DENTRO do app, nao na casca. O painel fica no TOPO de proposito,
     pra nao tapar justamente a base que estamos investigando. */
  if (/(^|[?&])diag/.test(location.search)) {
    document.documentElement.style.background = '#ff0000';
    document.body.style.background = '#ff0000';
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9;background:#000;' +
      'color:#0f0;font:11px/1.35 ui-monospace,monospace;padding:6px 8px;white-space:pre';
    var atualiza = function(){
      var wr = wrap.getBoundingClientRect();
      var ir = f.getBoundingClientRect();
      box.textContent =
        'inner ' + window.innerWidth + 'x' + window.innerHeight +
        '  vv ' + (window.visualViewport ? Math.round(window.visualViewport.height) : '-') +
        '  scr ' + screen.width + 'x' + screen.height +
        '\nwrap top ' + Math.round(wr.top) + '  bottom ' + Math.round(wr.bottom) +
        '  h ' + Math.round(wr.height) +
        '\niframe h ' + Math.round(ir.height) + '  bottom ' + Math.round(ir.bottom) +
        '\nSOBRA EMBAIXO ' + Math.round(window.innerHeight - ir.bottom) + 'px' +
        '  padTop ' + getComputedStyle(document.body).paddingTop +
        '\nstandalone ' + (navigator.standalone ? 'sim' : 'nao');
    };
    atualiza(); setInterval(atualiza, 1000);
    document.body.appendChild(box);
  }
})();
</script>
</body>
</html>
